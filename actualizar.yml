name: Actualizar sitio
on:
  schedule:
    - cron: "0 4 * * 1"   # cada lunes a las 04:00 (hora UTC)
  workflow_dispatch:       # permite pulsar un botón para ejecutarlo a mano
  push:
    branches: [main]       # también se ejecuta al subir archivos
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos de OpenStreetMap
        run: python actualizar.py
      - name: Preparar carpeta del sitio
        run: |
          mkdir _site
          cp index.html data.json _site/
          cp fondo.jpg fondo.txt _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
